<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>Sign up</title>
    <link rel="stylesheet" href="css/style2.css">
    <link rel="icon" href="css/images/A.ico">
</head>

<body>
    <div class="form-container">
        <h2>Create acount</h2>
        <form id="signupForm">
            <input type="username" id="signupusername" placeholder="username" required>
            <input type="email" id="signupEmail" placeholder="email" required>
            <input type="password" id="signupPassword" placeholder="password" required>
            <button type="submit">Signup</button>
        </form>
        <p>You have an acount_<a href="login.html">_Login</a></p>
        <p id="signupError" class="error"></p>
    </div>
    <footer>Develobed BY <a href="">Bika</a></footer>
    <script src="js/script.js"></script>
</body>

</html>
